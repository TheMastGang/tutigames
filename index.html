<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutiGames - Indie Game Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Logo Header -->
        <div class="logo-header">
            <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Gaming Avatar with Headphones + Gamepad -->
                <!-- Head Circle -->
                <circle cx="100" cy="70" r="45" fill="none" stroke="#00d2ff" stroke-width="3"/>
                <circle cx="100" cy="70" r="40" fill="#0b0c10" stroke="#00d2ff" stroke-width="2"/>
                
                <!-- Eyes -->
                <circle cx="85" cy="60" r="5" fill="#00d2ff"/>
                <circle cx="115" cy="60" r="5" fill="#00d2ff"/>
                
                <!-- Mouth -->
                <path d="M 85 80 Q 100 85 115 80" stroke="#00d2ff" stroke-width="2" fill="none" stroke-linecap="round"/>
                
                <!-- Left Headphone -->
                <circle cx="60" cy="70" r="12" fill="none" stroke="#00d2ff" stroke-width="2"/>
                <rect x="48" y="65" width="8" height="10" fill="#00d2ff" rx="4"/>
                
                <!-- Right Headphone -->
                <circle cx="140" cy="70" r="12" fill="none" stroke="#00d2ff" stroke-width="2"/>
                <rect x="144" y="65" width="8" height="10" fill="#00d2ff" rx="4"/>
                
                <!-- Headphone Band -->
                <path d="M 72 55 Q 100 40 128 55" stroke="#00d2ff" stroke-width="3" fill="none" stroke-linecap="round"/>
                
                <!-- Gamepad -->
                <rect x="65" y="120" width="70" height="35" fill="none" stroke="#00d2ff" stroke-width="2" rx="8"/>
                <circle cx="80" cy="130" r="3" fill="#00d2ff"/>
                <circle cx="80" cy="145" r="3" fill="#00d2ff"/>
                <circle cx="95" cy="137" r="3" fill="#00d2ff"/>
                <circle cx="65" cy="137" r="3" fill="#00d2ff"/>
                
                <!-- D-Pad -->
                <rect x="75" y="125" width="4" height="12" fill="#00d2ff"/>
                <rect x="71" y="129" width="12" height="4" fill="#00d2ff"/>
                
                <!-- Buttons -->
                <circle cx="135" cy="128" r="3" fill="#00d2ff"/>
                <circle cx="145" cy="128" r="3" fill="#00d2ff"/>
                <circle cx="140" cy="138" r="3" fill="#00d2ff"/>
                
                <!-- Glow Effect -->
                <circle cx="100" cy="70" r="48" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.3" class="glow"/>
            </svg>
            <h1>TutiGames</h1>
        </div>

        <!-- Bio Section -->
        <div class="bio-section">
            <p id="bio-text"></p>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="games">🎮 Games</button>
            <button class="tab-btn" data-tab="music">🎵 Music</button>
            <button class="tab-btn" data-tab="links">🔗 Links</button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content">
            <!-- Games Tab -->
            <div id="games" class="tab-pane active">
                <div id="games-list" class="items-list"></div>
            </div>

            <!-- Music Tab -->
            <div id="music" class="tab-pane">
                <div id="music-list" class="items-list"></div>
            </div>

            <!-- Links Tab -->
            <div id="links" class="tab-pane">
                <div id="links-list" class="items-list"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 TutiGames | Made with ❤️ by TheMastGang</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
