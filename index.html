<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TutiGames - Indie Game Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Logo Header -->
        <div class="logo-header">
            <div class="logo-wrapper">
                <img src="https://raw.githubusercontent.com/TheMastGang/tutigames/main/assets/logo.png" alt="TutiGames Logo" class="logo">
            </div>
            <h1>TutiGames</h1>
        </div>

        <!-- Bio Section -->
        <div class="bio-section">
            <p id="bio-text"></p>
        </div>

        <!-- Tab Navigation -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="games">🎮 Games</button>
            <button class="tab-btn" data-tab="music">🎵 Music</button>
            <button class="tab-btn" data-tab="links">🔗 Links</button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content">
            <!-- Games Tab -->
            <div id="games" class="tab-pane active">
                <div id="games-list" class="items-list"></div>
            </div>

            <!-- Music Tab -->
            <div id="music" class="tab-pane">
                <div id="music-list" class="items-list"></div>
            </div>

            <!-- Links Tab -->
            <div id="links" class="tab-pane">
                <div id="links-list" class="items-list"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2024 TutiGames | Made with ❤️ by TheMastGang</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
